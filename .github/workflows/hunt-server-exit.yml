# TEMPORARY — do not merge.
# Upstream Windows dev-fixture jobs leave ~22 processes behind ("Terminate orphan
# process" at cleanup): killing the spawned handle does not kill the tree on
# Windows. patches/ adds a `taskkill /T` to stopServer; this checks whether the
# orphans disappear. It also keeps the server-output capture, so a `server exited
# before becoming ready` here would explain itself.
name: hunt-server-exit

on:
  push:
    branches:
      - ci/hunt-server-exit

permissions: {}

jobs:
  hunt:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: 22
          cache: true

      - name: Install Playwright
        run: vp exec playwright-core install chromium

      - name: Prepare fixtures
        run: vp run test:prepare

      # no shell pipeline here: orphaned dev servers hold a pipe open and the
      # step never returns
      - name: Run dev fixtures (attempt ${{ matrix.attempt }})
        shell: bash
        run: vp exec vitest run --project "fixtures:vite-dev-*" > run.log 2>&1 || true

      - name: Report
        shell: bash
        run: |
          hits=$(grep -ac 'exited before becoming' run.log || true)
          {
            echo "### attempt ${{ matrix.attempt }}"
            echo '```'
            grep -aE 'Test Files |Tests  |Duration ' run.log | tail -3
            echo "server-exit hits: $hits"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$hits" -gt 0 ]; then
            grep -a -A 45 'exited before becoming' run.log | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::server-exit reproduced on attempt ${{ matrix.attempt }}"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # any node processes still alive here are what the runner would report as orphans
      - name: Leftover processes (the thing under test)
        shell: bash
        run: |
          left=$(tasklist //FI "IMAGENAME eq node.exe" | grep -c "node.exe" || true)
          echo "node.exe still running after the suite: $left" | tee -a "$GITHUB_STEP_SUMMARY"
